<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UCS Tracker</title>
  <link rel="stylesheet" href="style/style.css">
    <link rel="icon" type="image/png" href="images\UCS.ico">
</head>
<body>
 
<!-- NAVBAR -->
<nav class="navbar">
  <a href="https://www.ucs.br" target="_blank" class="logo-link">
    <img src="https://ucsvirtual.ucs.br/midia/imagens/logo-ucs.png" alt="Logo UCS" class="logo">
    <span class="textnav">Tracker</span>
  </a>
  <div class="usuario" id="usuario"></div>
</nav>
 
<!-- MODAL NOME -->
<div id="modalNome" class="modal">
  <div class="modal-content">
    <h2>Bem-vindo!</h2>
    <p>Informe seu nome para acessar o sistema.</p>
    <input type="text" id="inputNome" placeholder="Digite seu nome" autocomplete="off">
    <button class="btn-primary" onclick="salvarNome()">Entrar</button>
    <div class="made-by">UCS Tracker · Desenvolvido com o auxílio de IA · 2026</div>
  </div>
</div>
 
<!-- CONTEÚDO PRINCIPAL -->
<div class="main">
  <div class="page-title" id="pageTitle">Minhas Disciplinas</div>
  <div class="page-sub">Acompanhe suas notas e médias em tempo real.</div>
  <button class="btn-add" onclick="abrirFormDisciplina()">
    <span class="icon">＋</span> Adicionar Disciplina
  </button>
  <div class="disciplinas-list" id="disciplinasList"></div>
  <div class="footer">UCS Tracker · Desenvolvido com o auxílio de IA · 2026</div>
</div>
 
<!-- MODAL NOVA DISCIPLINA -->
<div id="modalDisciplina" class="modal" style="display:none;">
  <div class="modal-content" style="max-width:420px; width:95vw; text-align:left; max-height:90vh; overflow-y:auto;">
    <h2 style="text-align:center; margin-bottom:6px;">Nova Disciplina</h2>
    <p style="text-align:center; color:var(--text-light); font-size:13px; margin-bottom:18px;">Preencha os dados da disciplina</p>
 
    <div class="form-group" style="margin-bottom:14px;">
      <label>Nome da Disciplina</label>
      <input type="text" id="nd_nome" placeholder="Ex: Cálculo I" autocomplete="off">
    </div>
 
    <div class="form-row">
      <div class="form-group">
        <label>Nº de Avaliações</label>
        <input type="number" id="nd_num" min="1" max="10" value="3" oninput="renderPesos()">
      </div>
      <div class="form-group">
        <label>Tipo de Média</label>
        <select id="nd_tipo">
          <option value="arith">Aritmética Simples</option>
          <option value="ponderada">Ponderada</option>
          <option value="harmonica">Harmônica</option>
        </select>
      </div>
    </div>
 
    <div id="pesosContainer" style="margin-top:10px;"></div>
 
    <div class="form-group" style="margin-top:14px;">
      <label>Nota mínima para aprovação</label>
      <input type="number" id="nd_minAprov" step="0.1" min="0" max="10" placeholder="Ex: 6.0">
    </div>
 
    <div style="display:flex; gap:10px; margin-top:20px;">
      <button class="btn-primary" style="flex:1;" onclick="salvarDisciplina()">Salvar</button>
      <button class="btn-secondary" onclick="fecharModalDisciplina()" style="flex:1; padding:13px; border:1.5px solid var(--border); background:white; border-radius:var(--radius-sm); cursor:pointer; font-size:16px; font-weight:600; color:var(--text-mid); transition:background 0.2s;"
        onmouseover="this.style.background='#f0f3f7'" onmouseout="this.style.background='white'">Cancelar</button>  
    </div>
  </div>
</div>
</body>
<script src="script/script.js"></script>
</html>
